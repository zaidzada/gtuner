<title>Tuner</title>
<style>
  :root {
    --bg: #0b0d10;
    --fg: #e8eaed;
    --dim: #6b7280;
    --line: #1e2329;
    --accent: #34d399;
    --warn: #f0b429;
    --bar-h: 76px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 400 16px/1.4 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 28px;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  .stage { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 26px; }

  /* --- readout ---------------------------------------------------------- */
  .readout { text-align: center; }
  .note {
    font-size: clamp(76px, 24vw, 116px); font-weight: 300; letter-spacing: -0.04em;
    line-height: 1; font-variant-numeric: tabular-nums;
    transition: color .18s ease; color: var(--fg);
  }
  .note sub { font-size: .3em; font-weight: 400; vertical-align: baseline; color: var(--dim); margin-left: .06em; }
  .cents {
    margin-top: 10px; font-size: 17px; color: var(--dim);
    font-variant-numeric: tabular-nums; letter-spacing: .02em; height: 24px;
  }
  body[data-tuned="true"] .note { color: var(--accent); }
  body[data-active="false"] .note { color: var(--line); }
  body[data-active="false"] .cents { color: var(--line); }

  /* --- meter ------------------------------------------------------------ */
  .meter { position: relative; height: var(--bar-h); }
  .track {
    position: absolute; inset: 50% 0 auto; transform: translateY(-50%);
    height: 2px; background: var(--line);
  }
  .ticks { position: absolute; inset: 0; }
  .tick {
    position: absolute; top: 50%; width: 1px; background: var(--line);
    transform: translate(-50%, -50%);
  }
  .tick.minor { height: 12px; }
  .tick.major { height: 22px; }
  .detent {
    position: absolute; left: 50%; top: 50%; width: 2px; height: var(--bar-h);
    background: var(--line); transform: translate(-50%, -50%);
    transition: background .18s ease, box-shadow .18s ease;
  }
  body[data-tuned="true"] .detent { background: var(--accent); box-shadow: 0 0 22px 2px rgba(52,211,153,.5); }
  .needle {
    position: absolute; top: 50%; left: 50%; width: 4px; height: calc(var(--bar-h) - 10px);
    margin-left: -2px; border-radius: 2px; background: var(--warn);
    transform: translate(0, -50%); will-change: transform;
    transition: background .18s ease, opacity .25s ease;
  }
  body[data-tuned="true"] .needle { background: var(--accent); }
  body[data-active="false"] .needle { opacity: 0; }
  .dirs {
    position: absolute; inset: auto 0 -22px; display: flex; justify-content: space-between;
    font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--line);
  }

  /* --- strings ---------------------------------------------------------- */
  .strings { display: flex; justify-content: center; gap: 8px; }
  .string {
    flex: 1; max-width: 60px; padding: 9px 0; border: 1px solid var(--line); border-radius: 8px;
    background: none; color: var(--dim); font: inherit; font-size: 14px; text-align: center;
    transition: color .15s ease, border-color .15s ease, background .15s ease;
  }
  .string[data-on="true"] { color: var(--fg); border-color: #39414b; background: #12161b; }
  body[data-tuned="true"] .string[data-on="true"] { color: var(--accent); border-color: rgba(52,211,153,.45); }

  /* --- input level ------------------------------------------------------ */
  .level { display: flex; align-items: center; gap: 12px; }
  .level-track {
    position: relative; flex: 1; height: 4px; border-radius: 2px; background: var(--line);
  }
  .level-fill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 2px;
    background: #39414b; transition: background .25s ease;
  }
  .level-fill[data-hot="true"] { background: var(--accent); }
  .level-floor {
    position: absolute; top: -4px; bottom: -4px; width: 1px; background: #39414b;
  }
  .level-peak {
    position: absolute; top: -3px; bottom: -3px; width: 2px; border-radius: 1px;
    background: var(--fg); opacity: .45; transition: opacity .2s ease;
  }
  .level-db {
    font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums;
    min-width: 64px; text-align: right;
  }
  .hint {
    text-align: center; font-size: 13px; color: var(--warn); height: 18px;
    opacity: 0; transition: opacity .3s ease;
  }
  .hint[data-show="true"] { opacity: 1; }
  .level-track { cursor: pointer; }
  .diag {
    font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums;
    text-align: center; letter-spacing: .02em;
  }
  .diag[hidden] { display: none; }

  /* --- footer ----------------------------------------------------------- */
  .controls {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    font-size: 13px; color: var(--dim);
  }
  select, .step {
    background: none; border: 1px solid var(--line); border-radius: 7px; color: var(--dim);
    font: inherit; font-size: 13px; padding: 6px 8px;
  }
  select:focus-visible, .step:focus-visible, button:focus-visible { outline: 1px solid #39414b; outline-offset: 2px; }
  .a4 { display: flex; align-items: center; gap: 6px; }
  .step { width: 26px; padding: 5px 0; text-align: center; cursor: pointer; }
  .a4 output { font-variant-numeric: tabular-nums; min-width: 58px; text-align: center; }
  .hz { text-align: center; font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; height: 18px; }

  /* --- start / status --------------------------------------------------- */
  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; padding: 32px;
    background: var(--bg); text-align: center; z-index: 10;
  }
  .overlay[hidden] { display: none; }
  #start {
    background: none; border: 1px solid #39414b; border-radius: 999px; color: var(--fg);
    font: inherit; font-size: 15px; padding: 13px 30px; cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  #start:hover { border-color: var(--fg); background: #12161b; }
  #status { color: var(--dim); font-size: 14px; max-width: 34ch; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script type="text/x-audioworklet" id="src-capture-processor">
// AudioWorklet processor. Runs on the realtime audio thread, so it does as
// little as possible: copy samples into a ring buffer and hand off a window
// every HOP samples. All the actual analysis happens in a Worker.
//
// Buffers are recycled rather than allocated. We transfer a Float32Array out
// to the main thread; once the Worker is done with it, it comes back here and
// goes on the free list. After a second or so this loop allocates nothing at
// all, which keeps the GC away from the audio thread.

const FRAME = 4096;          // analysis window (~93 ms at 44.1 kHz)
const HOP = 1024;            // emit this often (~23 ms -> ~43 updates/sec)
const MASK = FRAME - 1;      // FRAME is a power of two

class CaptureProcessor extends AudioWorkletProcessor {
  constructor() {
    super();
    this.ring = new Float32Array(FRAME);
    this.idx = 0;
    this.filled = 0;
    this.sinceEmit = 0;
    this.pool = [];
    this.running = true;

    this.port.onmessage = (event) => {
      const data = event.data;
      if (data === 'stop') {
        this.running = false;
      } else if (data && data.buffer instanceof ArrayBuffer && data.buffer.byteLength) {
        // A window came back from the Worker; reuse it. A detached buffer
        // (byteLength 0) would throw on the next set() and kill the processor.
        if (this.pool.length < 4) this.pool.push(data);
      }
    };
  }

  process(inputs) {
    if (!this.running) return false;

    const channel = inputs[0] && inputs[0][0];
    if (!channel) return true;

    for (let i = 0; i < channel.length; i++) {
      this.ring[this.idx] = channel[i];
      this.idx = (this.idx + 1) & MASK;
    }
    if (this.filled < FRAME) this.filled = Math.min(FRAME, this.filled + channel.length);
    this.sinceEmit += channel.length;

    if (this.sinceEmit >= HOP && this.filled >= FRAME) {
      this.sinceEmit = 0;
      // An exception thrown out of process() puts the processor into an error
      // state that it never leaves — capture would stop for good. Nothing in
      // here should throw, but the cost of being sure is one try/catch.
      try {
        const out = this.pool.pop() || new Float32Array(FRAME);
        // Linearize the ring, oldest sample first. this.idx is both the next
        // write position and, once full, the oldest sample.
        const head = FRAME - this.idx;
        out.set(this.ring.subarray(this.idx), 0);
        out.set(this.ring.subarray(0, this.idx), head);
        this.port.postMessage(out, [out.buffer]);
      } catch {
        this.pool.length = 0;   // drop anything suspect and carry on
      }
    }

    return true;
  }
}

registerProcessor('capture-processor', CaptureProcessor);

</script>

<script type="text/x-worker" id="src-detector-worker">
// Worker thread. Owns the WASM instance and runs pitch detection.
//
// This lives off the audio thread on purpose: detect() takes ~4 ms, while an
// AudioWorklet callback must return in under ~2.9 ms. Running it inline would
// glitch the audio even though average CPU load is low.

let exports_ = null;
let input = null;
let output = null;
let memoryBuffer = null;

// WebAssembly.Memory views detach if memory ever grows. We don't grow, but
// re-deriving on change costs nothing and removes a whole class of bug.
function views() {
  if (memoryBuffer !== exports_.memory.buffer) {
    memoryBuffer = exports_.memory.buffer;
    input = new Float32Array(memoryBuffer, exports_.input_ptr(), exports_.frame_size());
    output = new Float32Array(memoryBuffer, exports_.output_ptr(), 4);
  }
  return { input, output };
}

self.onmessage = async (event) => {
  const msg = event.data;

  if (msg.type === 'init') {
    try {
      let bytes = msg.wasmBytes;
      if (!bytes) {
        const response = await fetch(msg.wasmUrl);
        if (!response.ok) throw new Error(`fetch ${msg.wasmUrl}: ${response.status}`);
        bytes = await response.arrayBuffer();
      }
      const { instance } = await WebAssembly.instantiate(bytes, {});
      exports_ = instance.exports;
      views();
      self.postMessage({ type: 'ready', frameSize: exports_.frame_size() });
    } catch (err) {
      self.postMessage({ type: 'error', message: String(err) });
    }
    return;
  }

  if (msg.type === 'frame') {
    const frame = msg.frame;
    if (!exports_) {
      self.postMessage({ type: 'recycle', frame }, [frame.buffer]);
      return;
    }
    const { input: inputView, output: outputView } = views();
    const n = Math.min(frame.length, inputView.length);
    inputView.set(frame.subarray(0, n));

    // gate 0 = use the module's silence floor; loudness must not gate real notes.
    const found = exports_.detect(n, msg.sampleRate, 0.15, 0);

    self.postMessage({
      type: 'result',
      found: found === 1,
      freq: outputView[0],
      clarity: outputView[1],
      rms: outputView[2],
      frame,                       // hand the buffer back for reuse
    }, [frame.buffer]);
  }
};

</script>

// --- src/music.js ----------------------------------------------------------
// Note names, tunings, and the logic that decides which string you're playing.

const SEMITONES = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };

/** "A#2" | "Eb3" | "E4"  ->  MIDI note number (A4 = 69). */
function noteToMidi(name) {
  const m = /^([A-G])([#b]?)(-?\d+)$/.exec(name.trim());
  if (!m) throw new Error(`bad note name: ${name}`);
  const [, letter, accidental, octave] = m;
  const alter = accidental === '#' ? 1 : accidental === 'b' ? -1 : 0;
  return 12 * (Number(octave) + 1) + SEMITONES[letter] + alter;
}

function midiToFreq(midi, a4 = 440) {
  return a4 * Math.pow(2, (midi - 69) / 12);
}

function noteToFreq(name, a4 = 440) {
  return midiToFreq(noteToMidi(name), a4);
}

/** Signed distance in cents. Positive = sharp. */
function cents(freq, target) {
  return 1200 * Math.log2(freq / target);
}

const TUNINGS = {
  standard:  { label: 'Standard',        notes: ['E2', 'A2', 'D3', 'G3', 'B3', 'E4'] },
  dropD:     { label: 'Drop D',          notes: ['D2', 'A2', 'D3', 'G3', 'B3', 'E4'] },
  halfStep:  { label: 'Half step down',  notes: ['D#2', 'G#2', 'C#3', 'F#3', 'A#3', 'D#4'] },
  wholeStep: { label: 'Whole step down', notes: ['D2', 'G2', 'C3', 'F3', 'A3', 'D4'] },
  openD:     { label: 'Open D',          notes: ['D2', 'A2', 'D3', 'F#3', 'A3', 'D4'] },
  openG:     { label: 'Open G',          notes: ['D2', 'G2', 'D3', 'G3', 'B3', 'D4'] },
  dadgad:    { label: 'DADGAD',          notes: ['D2', 'A2', 'D3', 'G3', 'A3', 'D4'] },
};

/** Build the target list for a tuning at a given A4 reference. */
function buildTargets(tuningKey, a4 = 440) {
  return TUNINGS[tuningKey].notes.map((note, i) => ({
    index: i,                       // 0 = lowest (6th string)
    note,
    label: note.replace(/-?\d+$/, ''),
    octave: Number(/-?\d+$/.exec(note)[0]),
    freq: noteToFreq(note, a4),
  }));
}

/**
 * Pick which string a frequency belongs to.
 *
 * Naive nearest-target matching flickers badly when you sit near the midpoint
 * between two strings, which is exactly where you are while tuning a badly
 * flat string. So once a string is chosen we keep it until some other target
 * is closer by more than `hysteresis` cents.
 */
function matchString(freq, targets, held = null, hysteresis = 40) {
  let best = null;
  let bestAbs = Infinity;
  for (const t of targets) {
    const abs = Math.abs(cents(freq, t.freq));
    if (abs < bestAbs) { bestAbs = abs; best = t; }
  }
  if (held === null) return best;

  const heldTarget = targets[held.index];
  if (!heldTarget) return best;
  const heldAbs = Math.abs(cents(freq, heldTarget.freq));
  return bestAbs < heldAbs - hysteresis ? best : heldTarget;
}

/** Median of a small array. Cheap outlier rejection for the frequency stream. */
function median(values) {
  const sorted = [...values].sort((a, b) => a - b);
  const mid = sorted.length >> 1;
  return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
}

// --- src/audio.js ----------------------------------------------------------
// Microphone capture and the worklet <-> worker plumbing.
//
//   mic -> AudioWorklet (ring buffer)  [audio thread]
//            | transfer
//          main thread (relay only)
//            | transfer
//          Worker -> WASM detect()     [worker thread]
//            | result
//          main thread -> onResult

// If no window arrives for this long while running, the capture chain has
// died. Windows normally arrive every ~23 ms, so this is a very quiet alarm.
const STALL_MS = 1500;
const WATCHDOG_INTERVAL_MS = 500;
const MAX_RECOVERIES = 6;

class TunerEngine {
  /**
   * @param {object} options
   * @param {(result: object) => void} options.onResult
   * @param {(state: string, detail?: string) => void} [options.onStateChange]
   * @param {string} options.workletUrl  AudioWorklet module (a real URL or a blob: URL)
   * @param {string} options.workerUrl   Worker script (a real URL or a blob: URL)
   * @param {string} [options.wasmUrl]   fetched by the worker
   * @param {Uint8Array} [options.wasmBytes]  used instead of wasmUrl when inlined
   */
  constructor({ onResult, onStateChange, workletUrl, workerUrl, wasmUrl, wasmBytes }) {
    this.onResult = onResult;
    this.onStateChange = onStateChange || (() => {});
    this.workletUrl = workletUrl;
    this.workerUrl = workerUrl;
    this.wasmUrl = wasmUrl;
    this.wasmBytes = wasmBytes;

    this.context = null;
    this.stream = null;
    this.node = null;
    this.worker = null;
    this.state = 'idle';

    // Every node in the graph is held here on purpose. A
    // MediaStreamAudioSourceNode that nothing references can be garbage
    // collected out from under a running graph — the classic Web Audio
    // failure where capture works for a few seconds and then silently stops.
    this.source = null;
    this.mute = null;

    this.frameCount = 0;      // windows delivered by the worklet
    this.resultCount = 0;     // results returned by the worker
    this.lastFrameAt = 0;
    this.stallCount = 0;
    this.recoveryCount = 0;
    this.watchdog = null;
    this.recovering = false;
  }

  setState(state, detail) {
    this.state = state;
    this.onStateChange(state, detail);
  }

  async start() {
    if (this.state === 'running' || this.state === 'starting') return;
    this.setState('starting');

    // Opened straight from disk. The mic would prompt and then the worklet
    // would fail on an opaque origin, so say why up front instead.
    if (location.protocol === 'file:') {
      this.setState('error',
        'This page has to be served over http:// or https:// — browsers block audio worklets on pages opened directly from disk. Any static host works, or run "python3 -m http.server" in this folder and open localhost.');
      return;
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      this.setState('error', 'This browser has no microphone API. Note that microphone access requires https:// or localhost.');
      return;
    }

    try {
      // Browser voice processing is tuned for speech and will actively mangle
      // a sustained guitar tone. All three must be off.
      this.stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false,
          channelCount: 1,
        },
      });
    } catch (err) {
      const name = err && err.name;
      const message =
        name === 'NotAllowedError' ? 'Microphone access was blocked. Allow it in your browser settings and reload.'
        : name === 'NotFoundError' ? 'No microphone was found.'
        : `Could not open the microphone (${name || err}).`;
      this.setState('error', message);
      return;
    }

    this.watchTrack();

    this.context = new (window.AudioContext || window.webkitAudioContext)();
    // Chrome can suspend a context and Safari can mark it "interrupted" (a
    // phone call, another app taking the audio device). Neither fires an
    // error — the graph just stops — so resume whenever it happens.
    this.context.onstatechange = () => {
      if (!this.context) return;
      if (this.context.state === 'suspended' || this.context.state === 'interrupted') {
        this.context.resume().catch(() => {});
      }
    };
    if (this.context.state === 'suspended') await this.context.resume();

    try {
      await this.context.audioWorklet.addModule(this.workletUrl);
    } catch (err) {
      this.setState('error', `Could not load the audio processor: ${err}`);
      return;
    }

    this.worker = new Worker(this.workerUrl);

    const ready = new Promise((resolve, reject) => {
      const onFirst = (event) => {
        if (event.data.type === 'ready') { this.worker.removeEventListener('message', onFirst); resolve(); }
        else if (event.data.type === 'error') { this.worker.removeEventListener('message', onFirst); reject(new Error(event.data.message)); }
      };
      this.worker.addEventListener('message', onFirst);
    });
    if (this.wasmBytes) {
      // Inlined build: hand the module straight over. No fetch involved, which
      // also means no same-origin questions to answer.
      this.worker.postMessage({ type: 'init', wasmBytes: this.wasmBytes });
    } else {
      this.worker.postMessage({ type: 'init', wasmUrl: this.wasmUrl });
    }

    try {
      await ready;
    } catch (err) {
      this.setState('error', `Could not load the pitch detector: ${err.message}`);
      return;
    }

    this.buildGraph();

    this.worker.onmessage = (event) => {
      const msg = event.data;
      if (msg.type !== 'result' && msg.type !== 'recycle') return;
      // The buffer goes home first, no matter what the UI callback does. If a
      // render error could swallow buffers, the pool would drain and the
      // worklet would allocate on the audio thread forever after.
      const frame = msg.frame;
      try {
        if (msg.type === 'result') {
          this.resultCount++;
          this.onResult(msg);
        }
      } finally {
        if (this.node && frame && frame.buffer.byteLength) {
          this.node.port.postMessage(frame, [frame.buffer]);
        }
      }
    };

    this.lastFrameAt = performance.now();
    this.startWatchdog();
    this.setState('running');
  }

  /** Wire mic -> worklet -> silent gain -> destination. */
  buildGraph() {
    this.source = this.context.createMediaStreamSource(this.stream);
    this.node = new AudioWorkletNode(this.context, 'capture-processor');

    this.node.port.onmessage = (event) => {
      const frame = event.data;
      this.frameCount++;
      this.lastFrameAt = performance.now();
      this.worker.postMessage(
        { type: 'frame', frame, sampleRate: this.context.sampleRate },
        [frame.buffer],
      );
    };

    // The graph only pulls nodes that reach the destination, so the worklet
    // has to be connected — but through a silent gain, or you get feedback.
    this.mute = this.context.createGain();
    this.mute.gain.value = 0;
    this.source.connect(this.node);
    this.node.connect(this.mute);
    this.mute.connect(this.context.destination);
  }

  teardownGraph() {
    for (const node of [this.source, this.node, this.mute]) {
      try { node && node.disconnect(); } catch { /* already gone */ }
    }
    if (this.node) this.node.port.onmessage = null;
    this.source = this.node = this.mute = null;
  }

  /** A microphone can be muted, stolen by another app, or unplugged. */
  watchTrack() {
    const track = this.stream && this.stream.getAudioTracks()[0];
    if (!track) return;
    track.onended = () => this.recover('the microphone was disconnected');
    track.onmute = () => this.setState('running', 'muted');
    track.onunmute = () => this.setState('running');
  }

  startWatchdog() {
    this.stopWatchdog();
    this.watchdog = setInterval(() => {
      if (this.state !== 'running' || this.recovering) return;
      if (performance.now() - this.lastFrameAt < STALL_MS) return;
      this.stallCount++;
      this.recover('the audio pipeline stopped delivering samples');
    }, WATCHDOG_INTERVAL_MS);
  }

  stopWatchdog() {
    if (this.watchdog !== null) { clearInterval(this.watchdog); this.watchdog = null; }
  }

  /**
   * Rebuild whatever died. Cheapest repair first: relink the graph. If the
   * microphone track itself is gone, go all the way back to getUserMedia.
   */
  async recover(reason) {
    if (this.recovering || this.state === 'idle') return;
    if (this.recoveryCount >= MAX_RECOVERIES) {
      this.stopWatchdog();
      this.setState('error', `Audio kept stopping (${reason}). Reload the page to try again.`);
      return;
    }
    this.recovering = true;
    this.recoveryCount++;
    this.setState('recovering', reason);

    try {
      const track = this.stream && this.stream.getAudioTracks()[0];
      const trackDead = !track || track.readyState === 'ended';

      this.teardownGraph();

      if (trackDead) {
        if (this.stream) this.stream.getTracks().forEach((t) => t.stop());
        this.stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 },
        });
        this.watchTrack();
      }

      if (this.context.state !== 'running') await this.context.resume();
      this.buildGraph();

      this.lastFrameAt = performance.now();
      this.setState('running');
    } catch (err) {
      this.setState('error', `Could not restart audio: ${err && err.message ? err.message : err}`);
    } finally {
      this.recovering = false;
    }
  }

  async stop() {
    this.stopWatchdog();
    if (this.node) this.node.port.postMessage('stop');
    this.teardownGraph();
    if (this.worker) { this.worker.terminate(); this.worker = null; }
    if (this.stream) { this.stream.getTracks().forEach((t) => t.stop()); this.stream = null; }
    if (this.context) { this.context.onstatechange = null; await this.context.close(); this.context = null; }
    this.setState('idle');
  }
}

// --- src/app.js ------------------------------------------------------------
// UI state and rendering.


const IN_TUNE_CENTS = 5;      // green window
const HOLD_MS = 600;          // keep the last reading up this long after a note dies
const CLARITY_MIN = 0.85;     // reject weak / non-periodic frames
const HISTORY = 5;            // median filter length
const SMOOTHING = 0.25;       // needle easing per frame

// Input level meter, in dBFS. The scale is logarithmic because microphone
// levels are: a guitar that reads 5% of full scale linearly is a perfectly
// usable -26 dB, and a linear bar would show it as nearly nothing.
const LEVEL_MIN_DB = -80;     // left edge of the meter
const LEVEL_FLOOR_DB = -70;   // below here detection gets unreliable
const PEAK_FALL_DB_PER_SEC = 24;
const QUIET_HINT_AFTER_MS = 2500;

const el = {
  body: document.body,
  note: document.getElementById('note'),
  cents: document.getElementById('cents'),
  hz: document.getElementById('hz'),
  hint: document.getElementById('hint'),
  needle: document.getElementById('needle'),
  ticks: document.getElementById('ticks'),
  strings: document.getElementById('strings'),
  levelFill: document.getElementById('level-fill'),
  levelPeak: document.getElementById('level-peak'),
  levelFloor: document.getElementById('level-floor'),
  levelDb: document.getElementById('level-db'),
  levelTrack: document.querySelector('.level-track'),
  diag: document.getElementById('diag'),
  tuning: document.getElementById('tuning'),
  a4: document.getElementById('a4'),
  a4up: document.getElementById('a4up'),
  a4down: document.getElementById('a4down'),
  overlay: document.getElementById('overlay'),
  start: document.getElementById('start'),
  status: document.getElementById('status'),
};

const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem(key); return v === null ? fallback : v; }
    catch { return fallback; }
  },
  set(key, value) { try { localStorage.setItem(key, value); } catch { /* private mode */ } },
};

const state = {
  tuningKey: TUNINGS[store.get('tuning', 'standard')] ? store.get('tuning', 'standard') : 'standard',
  a4: Math.min(466, Math.max(415, Number(store.get('a4', 440)) || 440)),
  targets: [],
  history: [],
  held: null,
  lastGoodAt: 0,
  displayCents: 0,
  displayed: null,          // { target, centsOff, freq }
  levelDb: -120,
  peakDb: -120,
  peakAt: 0,
  running: false,
  recovering: null,         // reason string while the engine is reconnecting
  showDiagnostics: new URLSearchParams(location.search).has('debug'),
  frameMark: { count: 0, at: 0, perSecond: 0 },
};

// --- setup -----------------------------------------------------------------

const dbToPercent = (db) =>
  Math.max(0, Math.min(100, ((db - LEVEL_MIN_DB) / -LEVEL_MIN_DB) * 100));

function buildTicks() {
  const frag = document.createDocumentFragment();
  for (let c = -50; c <= 50; c += 10) {
    if (c === 0) continue;              // the detent covers centre
    const tick = document.createElement('div');
    tick.className = `tick ${Math.abs(c) === 50 ? 'major' : 'minor'}`;
    tick.style.left = `${50 + c}%`;
    frag.appendChild(tick);
  }
  el.ticks.appendChild(frag);
  el.levelFloor.style.left = `${dbToPercent(LEVEL_FLOOR_DB)}%`;
}

function buildTuningOptions() {
  for (const [key, { label }] of Object.entries(TUNINGS)) {
    const option = document.createElement('option');
    option.value = key;
    option.textContent = label;
    el.tuning.appendChild(option);
  }
  el.tuning.value = state.tuningKey;
}

function refreshTargets() {
  state.targets = buildTargets(state.tuningKey, state.a4);
  state.held = null;
  state.history = [];
  el.strings.innerHTML = '';
  for (const target of state.targets) {
    const cell = document.createElement('div');
    cell.className = 'string';
    cell.dataset.on = 'false';
    cell.dataset.note = target.note;
    cell.textContent = target.label;
    el.strings.appendChild(cell);
  }
  el.a4.textContent = `A4 ${state.a4}`;
}

// --- detection stream ------------------------------------------------------

function onResult(msg) {
  // The level meter updates on every frame, detected pitch or not — it is the
  // only thing that can tell you the microphone is working but too quiet.
  const now = performance.now();
  state.levelDb = msg.rms > 0 ? 20 * Math.log10(msg.rms) : -120;
  if (state.levelDb > state.peakDb) {
    state.peakDb = state.levelDb;
    state.peakAt = now;
  }

  if (!msg.found || msg.clarity < CLARITY_MIN) return;

  state.history.push(msg.freq);
  if (state.history.length > HISTORY) state.history.shift();
  if (state.history.length < 3) return;

  const freq = median(state.history);
  const target = matchString(freq, state.targets, state.held);
  state.held = target;
  state.lastGoodAt = now;
  state.displayed = { target, centsOff: cents(freq, target.freq), freq };
}

// --- render ----------------------------------------------------------------

/** The meter spans +/-50 cents across the full track width. */
function moveNeedle(centsValue) {
  const halfWidth = el.needle.parentElement.clientWidth / 2;
  el.needle.style.transform = `translate(${(centsValue / 50) * halfWidth}px, -50%)`;
}

let lastFrameAt = performance.now();

function renderLevel(now, elapsedSec) {
  // Peak marker falls back at a fixed rate rather than snapping, so a single
  // pluck stays readable long enough to see how hard you hit it.
  state.peakDb = Math.max(state.levelDb, state.peakDb - PEAK_FALL_DB_PER_SEC * elapsedSec);

  const audible = state.levelDb > LEVEL_MIN_DB;
  el.levelFill.style.width = `${dbToPercent(state.levelDb)}%`;
  el.levelFill.dataset.hot = String(state.levelDb >= LEVEL_FLOOR_DB);
  el.levelPeak.style.left = `${dbToPercent(state.peakDb)}%`;
  el.levelPeak.style.opacity = state.peakDb > LEVEL_MIN_DB ? '0.45' : '0';
  el.levelDb.textContent = audible ? `${state.levelDb.toFixed(0)} dB` : '—';

  // Reconnecting takes priority: the screen is frozen for a real reason and
  // saying so beats letting it look broken.
  if (state.recovering) {
    el.hint.dataset.show = 'true';
    el.hint.textContent = 'Audio stopped — reconnecting…';
    return;
  }

  // Signal is arriving but nothing is being detected: say why.
  const starved = state.running
    && now - state.lastGoodAt > QUIET_HINT_AFTER_MS
    && state.peakDb < LEVEL_FLOOR_DB;
  el.hint.dataset.show = String(starved);
  if (starved) {
    el.hint.textContent = state.peakDb < -95
      ? 'No signal — is the right microphone selected?'
      : 'Too quiet to detect — move closer to the mic.';
  }
}

/**
 * Frames per second is the number that matters when something goes wrong:
 * a healthy pipeline delivers ~43/s, and zero means capture has died even
 * though the rest of the page looks fine.
 */
function renderDiagnostics(now) {
  if (!state.showDiagnostics) return;
  const mark = state.frameMark;
  if (now - mark.at >= 1000) {
    mark.perSecond = ((engine.frameCount - mark.count) * 1000) / (now - mark.at);
    mark.count = engine.frameCount;
    mark.at = now;
  }
  el.diag.textContent =
    `${mark.perSecond.toFixed(0)} frames/s · ${engine.frameCount} total · ` +
    `${engine.stallCount} stalls · ${engine.recoveryCount} recoveries · ` +
    `${engine.context ? engine.context.state : '—'} @ ${engine.context ? (engine.context.sampleRate / 1000).toFixed(1) : '—'} kHz`;
}

function clearReadout() {
  el.note.textContent = '–';
  el.cents.textContent = '';
  el.hz.textContent = '';
  for (const cell of el.strings.children) cell.dataset.on = 'false';
}

function render() {
  const now = performance.now();
  const elapsedSec = Math.min(0.1, (now - lastFrameAt) / 1000);
  lastFrameAt = now;

  renderLevel(now, elapsedSec);
  renderDiagnostics(now);

  const active = state.displayed !== null && now - state.lastGoodAt < HOLD_MS;

  if (!active) {
    if (state.displayed && now - state.lastGoodAt > HOLD_MS * 3) {
      // Fully let go: clear the readout instead of leaving a stale note on
      // screen, which reads as the tuner having frozen.
      state.displayed = null;
      state.history = [];
      state.held = null;
      clearReadout();
    }
    el.body.dataset.active = 'false';
    el.body.dataset.tuned = 'false';
    state.displayCents += (0 - state.displayCents) * SMOOTHING;
    moveNeedle(state.displayCents);
    requestAnimationFrame(render);
    return;
  }

  const { target, centsOff, freq } = state.displayed;
  const tuned = Math.abs(centsOff) <= IN_TUNE_CENTS;

  el.body.dataset.active = 'true';
  el.body.dataset.tuned = String(tuned);

  el.note.innerHTML = `${target.label}<sub>${target.octave}</sub>`;
  el.cents.textContent = tuned
    ? 'in tune'
    : `${centsOff > 0 ? '+' : '−'}${Math.abs(centsOff).toFixed(1)} ¢`;
  el.hz.textContent = `${freq.toFixed(2)} Hz · target ${target.freq.toFixed(2)} Hz`;

  for (const cell of el.strings.children) {
    cell.dataset.on = String(cell.dataset.note === target.note);
  }

  const clamped = Math.max(-50, Math.min(50, centsOff));
  state.displayCents += (clamped - state.displayCents) * SMOOTHING;
  moveNeedle(state.displayCents);

  requestAnimationFrame(render);
}

// --- wiring ----------------------------------------------------------------

const engine = new TunerEngine({
  ...resolveSources(),
  onResult,
  onStateChange(engineState, detail) {
    state.running = engineState === 'running';
    state.recovering = engineState === 'recovering' ? (detail || 'reconnecting') : null;
    if (engineState === 'running') {
      el.overlay.hidden = true;
      state.lastGoodAt = performance.now();
    } else if (engineState === 'recovering') {
      // Leave the readout alone; the hint line explains what is happening.
    } else if (engineState === 'error') {
      el.overlay.hidden = false;
      el.start.textContent = 'Try again';
      el.status.textContent = detail;
      el.status.dataset.error = 'true';
    } else if (engineState === 'starting') {
      el.start.disabled = true;
      el.status.textContent = 'Waiting for microphone permission…';
    }
    if (engineState !== 'starting') el.start.disabled = false;
  },
});

el.start.addEventListener('click', () => engine.start());

// Tap the level bar to show pipeline diagnostics (or load with ?debug).
el.levelTrack.addEventListener('click', () => {
  state.showDiagnostics = !state.showDiagnostics;
  el.diag.hidden = !state.showDiagnostics;
});

if (location.protocol === 'file:') {
  el.status.textContent = 'Serve this over http:// — opening it straight from disk will not work.';
}

el.tuning.addEventListener('change', () => {
  state.tuningKey = el.tuning.value;
  store.set('tuning', state.tuningKey);
  refreshTargets();
});

function nudgeA4(delta) {
  state.a4 = Math.min(466, Math.max(415, state.a4 + delta));
  store.set('a4', String(state.a4));
  refreshTargets();
}
el.a4up.addEventListener('click', () => nudgeA4(1));
el.a4down.addEventListener('click', () => nudgeA4(-1));

el.diag.hidden = !state.showDiagnostics;
buildTicks();
buildTuningOptions();
refreshTargets();
requestAnimationFrame(render);

// Exposed for the end-to-end test harness.
window.__tuner = { state, engine };
</script>
</body>
</html>
